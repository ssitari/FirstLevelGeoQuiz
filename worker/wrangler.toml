# Cloudflare Worker for the community stats backend.
# Deploy: see worker/README.md

name = "flgq-stats"
main = "index.js"
compatibility_date = "2025-01-01"

# Fill database_id after `wrangler d1 create flgq-stats`
[[d1_databases]]
binding = "DB"
database_name = "flgq-stats"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
